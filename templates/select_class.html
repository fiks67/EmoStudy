<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Class — Emotion Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="/static/js/i18n.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f0f9ff;position:relative;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(72px);opacity:.38;pointer-events:none;z-index:0}
.b1{width:400px;height:400px;background:#0ea5e9;top:-140px;right:-120px}
.b2{width:350px;height:350px;background:#f59e0b;bottom:-100px;left:-100px}
.card{position:relative;z-index:1;background:#fff;border-radius:28px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(14,165,233,.18)}
.brand{text-align:center;margin-bottom:32px}
.emoji-row{font-size:52px;margin-bottom:14px;animation:wave 2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.brand h1{font-size:22px;font-weight:900;color:#0f172a}
.brand p{font-size:14px;color:#64748b;margin-top:6px;font-weight:600}
.brand strong{color:#0ea5e9}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:800;color:#374151;margin-bottom:8px}
.code-input{width:100%;padding:16px;border:2.5px solid #bae6fd;border-radius:16px;font-size:26px;text-align:center;letter-spacing:8px;text-transform:uppercase;font-weight:900;color:#0ea5e9;font-family:inherit;transition:.2s;background:#f0f9ff}
.code-input:focus{border-color:#0ea5e9;background:#fff;outline:none;box-shadow:0 0 0 4px rgba(14,165,233,.15)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,165,233,.35)}
.alert-error{padding:12px 14px;border-radius:14px;font-size:13px;margin-bottom:18px;background:#fef2f2;color:#dc2626;border:2px solid #fecaca;display:flex;align-items:center;gap:8px;font-weight:700}
.hint{text-align:center;font-size:13px;color:#94a3b8;margin-top:14px;line-height:1.6;font-weight:600}
.switch-link{text-align:center;margin-top:16px;font-size:13px;color:#94a3b8;font-weight:600}
.switch-link a{color:#7c3aed;font-weight:900;text-decoration:none}
.lang-bar{position:fixed;top:14px;right:16px;display:inline-flex;align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:10px;padding:3px;gap:2px;box-shadow:0 2px 12px rgba(0,0,0,.1);z-index:10}
.lang-btn{padding:5px 10px;border:none;border-radius:7px;background:transparent;color:#64748b;font-size:11px;font-weight:800;letter-spacing:.4px;cursor:pointer;transition:.2s;font-family:'Nunito',sans-serif}
.lang-btn:hover{background:#e2e8f0;color:#334155}
.lang-btn--active{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 1px 4px rgba(99,102,241,.35)}
@media(max-width:480px){
  .card{padding:32px 20px;border-radius:22px}
  .emoji-row{font-size:42px}
  .brand h1{font-size:18px}
  .brand p{font-size:13px}
  .code-input{font-size:20px;letter-spacing:5px;padding:14px}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="lang-bar">
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  <button class="lang-btn" data-lang="id" onclick="setLang('id')">ID</button>
  <button class="lang-btn" data-lang="my" onclick="setLang('my')">MY</button>
</div>
<div class="card">
  <div class="brand">
    <div class="emoji-row">🏫</div>
    <h1 data-i18n="title_select_class">Join Your Class</h1>
    <p>Hello, <strong>{{ name }}</strong>! Enter the class code from your teacher.</p>
  </div>

  {% if error %}<div class="alert-error">⚠ {{ error }}</div>{% endif %}

  <form action="/student/join-class" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label data-i18n="lbl_class_code">Class Code</label>
      <input class="code-input" type="text" name="class_code" placeholder="XXXXXX" maxlength="10" required autofocus>
    </div>
    <button type="submit" class="btn" data-i18n="btn_join">Join Class →</button>
  </form>
  <div class="hint" data-i18n="msg_class_code_hint">💡 Your teacher will share the class code before the session starts.</div>
  <div class="switch-link"><a href="/logout" data-i18n="misc_switch_account">Switch account</a></div>
</div>
</body>
</html>
